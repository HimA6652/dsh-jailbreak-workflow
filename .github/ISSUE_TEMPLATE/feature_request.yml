name: 功能建议 / Feature request
description: 想要新功能或改进现有行为
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      description: 现在哪儿不顺手，或者哪个场景覆盖不到。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 想过的其他办法，或现在临时怎么绕的。
